<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height: 44px; border-radius: 12px; background: #F2F4F6; display: flex; align-items: center; gap: 10px; padding: 0 14px; box-sizing: border-box; font-family: Pretendard, -apple-system, sans-serif;">
  <svg width="18" height="18" viewBox="0 0 18 18" style="flex-shrink: 0;"><circle cx="8" cy="8" r="5.5" style="stroke: #8B95A1; stroke-width: 1.8; fill: none;"></circle><path d="M12.5 12.5L16 16" style="stroke: #8B95A1; stroke-width: 1.8; stroke-linecap: round;"></path></svg>
  <input type="text" placeholder="{{ placeholder }}" value="{{ value }}" onInput="{{ onInput }}" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 15px; font-family: Pretendard, sans-serif; color: #191F28;">
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 360, &quot;height&quot;: 60}, &quot;placeholder&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;ETF·테마 검색&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;value&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;onInput&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;(e) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() { const p = this.props; return { placeholder: p.placeholder || '검색', value: p.value || '', onInput: p.onInput || (() => {}) }; }
}
</script>
</body>
</html>
