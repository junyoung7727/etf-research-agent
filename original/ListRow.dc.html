<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ onClick }}" style="display: flex; align-items: center; gap: 14px; padding: 14px 8px; cursor: pointer; font-family: Pretendard, -apple-system, sans-serif; border-bottom: {{ line }};" style-active="opacity: 0.6;">
  <sc-if value="{{ hasGlyph }}"><span style="width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; color: #333D4B;">{{ glyph }}</span></sc-if>
  <sc-if value="{{ hasIcon }}"><span style="width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
    <sc-if value="{{ iChart }}"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 15.5l4.5-5 3.5 3 6-7.5" style="stroke: #333D4B; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round;"></path></svg></sc-if>
    <sc-if value="{{ iIssue }}"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 4h12v12H4z" style="stroke: #333D4B; stroke-width: 1.7; fill: none; stroke-linejoin: round;"></path><path d="M7 8h6M7 11h6M7 14h3" style="stroke: #333D4B; stroke-width: 1.7; stroke-linecap: round;"></path></svg></sc-if>
    <sc-if value="{{ iStar }}"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 2.8l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L2.8 8.1l5-.7z" style="stroke: #333D4B; stroke-width: 1.7; fill: none; stroke-linejoin: round;"></path></svg></sc-if>
    <sc-if value="{{ iSearch }}"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.5" style="stroke: #333D4B; stroke-width: 1.8; fill: none;"></circle><path d="M13.2 13.2l3.5 3.5" style="stroke: #333D4B; stroke-width: 1.8; stroke-linecap: round;"></path></svg></sc-if>
    <sc-if value="{{ iTheme }}"><svg width="20" height="20" viewBox="0 0 20 20"><rect x="3" y="3" width="6" height="6" rx="1.5" style="stroke: #333D4B; stroke-width: 1.7; fill: none;"></rect><rect x="11" y="3" width="6" height="6" rx="1.5" style="stroke: #333D4B; stroke-width: 1.7; fill: none;"></rect><rect x="3" y="11" width="6" height="6" rx="1.5" style="stroke: #333D4B; stroke-width: 1.7; fill: none;"></rect><rect x="11" y="11" width="6" height="6" rx="1.5" style="stroke: #333D4B; stroke-width: 1.7; fill: none;"></rect></svg></sc-if>
    <sc-if value="{{ iComm }}"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M17 10.4c0 2.9-3.1 5.2-7 5.2-.9 0-1.7-.1-2.5-.4L4 16.5l.8-2.7C3.7 12.9 3 11.7 3 10.4 3 7.5 6.1 5.2 10 5.2s7 2.3 7 5.2z" style="stroke: #333D4B; stroke-width: 1.7; fill: none; stroke-linejoin: round;"></path></svg></sc-if>
    <sc-if value="{{ iBell }}"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 3a4.5 4.5 0 00-4.5 4.5v2.7L4 13h12l-1.5-2.8V7.5A4.5 4.5 0 0010 3z" style="stroke: #333D4B; stroke-width: 1.7; fill: none; stroke-linejoin: round;"></path><path d="M8.2 15.5a1.9 1.9 0 003.6 0" style="stroke: #333D4B; stroke-width: 1.7; fill: none; stroke-linecap: round;"></path></svg></sc-if>
  </span></sc-if>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
    <span style="font-size: 15.5px; font-weight: 600; color: {{ labelColor }}; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ label }}</span>
    <sc-if value="{{ hasSub }}"><span style="font-size: 12.5px; color: #6B7684; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ sub }}</span></sc-if>
  </div>
  <sc-if value="{{ hasValue }}"><span style="flex-shrink: 0; font-size: 14px; color: #6B7684;">{{ value }}</span></sc-if>
  <sc-if value="{{ hasChevron }}" hint-placeholder-val="{{ true }}"><dc-import name="Chevron" hint-size="16px,16px" size="16" color="#B0B8C1"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:60},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;항목&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;glyph&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;labelColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#191F28&quot;,&quot;options&quot;:[&quot;#191F28&quot;,&quot;#F04452&quot;,&quot;#4E5968&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;chevron&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;divider&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;options&quot;:[&quot;&quot;,&quot;chart&quot;,&quot;issue&quot;,&quot;star&quot;,&quot;search&quot;,&quot;theme&quot;,&quot;comm&quot;,&quot;bell&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const ic = p.icon || '';
    return { label: p.label || '', labelColor: p.labelColor || '#191F28', glyph: p.glyph || '', hasGlyph: !!p.glyph && !ic, hasIcon: !!ic,
      iChart: ic === 'chart', iIssue: ic === 'issue', iStar: ic === 'star', iSearch: ic === 'search', iTheme: ic === 'theme', iComm: ic === 'comm', iBell: ic === 'bell', sub: p.sub || '', hasSub: !!p.sub, value: p.value || '', hasValue: !!p.value,
      hasChevron: p.chevron !== undefined ? !!p.chevron : true, line: p.divider ? '1px solid #F2F4F6' : 'none', onClick: p.onClick || (() => {}) };
  }
}
</script>
</body>
</html>
