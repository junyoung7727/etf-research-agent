<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div data-afi="{{ index }}" onClick="{{ onSelect }}" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #EEF1F4; cursor: {{ cursor }};">
  <span data-hint="{{ hintKey }}" onClick="{{ onHint }}" style="display: inline-flex; flex-shrink: 0; cursor: pointer;">
    <dc-import name="Sticker" hint-size="80px,30px" mark="{{ mark }}" mark-size="{{ markSize }}" color="{{ color }}" bg="{{ bg }}" line="{{ line }}" label="{{ name }}" label-color="{{ labelColor }}" size="30" radius="11"></dc-import>
  </span>
  <div style="flex: 1; min-width: 0; font-size: 15px; font-weight: 600; color: #191F28; line-height: 1.5; word-break: keep-all; text-wrap: pretty;">{{ summary }}</div>
  <sc-if value="{{ hasPage }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 16 16" style="flex-shrink: 0;"><path d="M6 3.5l4.5 4.5L6 12.5" style="stroke: #B0B8C1; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round;"></path></svg></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 380, &quot;height&quot;: 80}, &quot;index&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 0, &quot;min&quot;: 0, &quot;max&quot;: 4, &quot;tsType&quot;: &quot;number&quot;}, &quot;name&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;매크로&quot;, &quot;options&quot;: [&quot;이슈&quot;, &quot;차트&quot;, &quot;매크로&quot;, &quot;밸류&quot;, &quot;수급&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;summary&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;중국이 태양광 패널을 덜 만드는지가 가장 큰 변수예요.&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;mark&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;▼&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;markSize&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;12px&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;color&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#3182F6&quot;, &quot;options&quot;: [&quot;#F04452&quot;, &quot;#8E8E93&quot;, &quot;#3182F6&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;bg&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;rgba(49,130,246,0.18)&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;line&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;rgba(49,130,246,0.18)&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;labelColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#1B64DA&quot;, &quot;options&quot;: [&quot;#D22F3D&quot;, &quot;#636366&quot;, &quot;#1B64DA&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;hintKey&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;macro&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;hasPage&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;onSelect&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;(e: MouseEvent) =&gt; void&quot;}, &quot;onHint&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;(e: MouseEvent) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      index: p.index ?? 0,
      hintKey: p.hintKey ?? 'factors',
      name: p.factorName ?? p.name ?? '매크로',
      summary: p.summary ?? '',
      mark: p.mark ?? '■',
      markSize: p.markSize ?? '13px',
      color: p.color ?? '#8E8E93',
      bg: p.bg ?? 'rgba(142,142,147,0.22)',
      line: p.line ?? 'rgba(142,142,147,0.2)',
      labelColor: p.labelColor ?? '#636366',
      hasPage: p.hasPage ?? false,
      cursor: p.hasPage ? 'pointer' : 'default',
      onSelect: p.onSelect,
      onHint: p.onHint
    };
  }
}
</script>
</body>
</html>
