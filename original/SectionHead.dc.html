<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display: flex; align-items: baseline; gap: 8px; padding: 0 20px; font-family: Pretendard, -apple-system, sans-serif;">
  <span style="flex: 1; min-width: 0; font-size: 20px; font-weight: 800; color: #191F28; letter-spacing: -0.03em; word-break: keep-all;">{{ title }}</span>
  <sc-if value="{{ hasAction }}"><span onClick="{{ onAction }}" style="flex-shrink: 0; display: flex; align-items: center; gap: 2px; font-size: 12.5px; font-weight: 700; color: #3D34E0; cursor: pointer; white-space: nowrap;">{{ actionLabel }}<dc-import name="Chevron" hint-size="14px,14px" size="14" color="#3D34E0"></dc-import></span></sc-if>
  <sc-if value="{{ hasMeta }}"><span style="flex-shrink: 0; font-size: 12.5px; color: #6B7684; white-space: nowrap;">{{ meta }}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 402, &quot;height&quot;: 50}, &quot;title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;섹션 제목&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;actionLabel&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;onAction&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;() =&gt; void&quot;}, &quot;meta&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { title: p.title || '', hasAction: !!p.actionLabel, actionLabel: p.actionLabel || '', onAction: p.onAction || (() => {}), hasMeta: !p.actionLabel && !!p.meta, meta: p.meta || '' };
  }
}
</script>
</body>
</html>
