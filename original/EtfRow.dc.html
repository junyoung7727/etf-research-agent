<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ onClick }}" style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: {{ line }}; cursor: pointer; font-family: Pretendard, -apple-system, sans-serif;" style-active="opacity: 0.7;">
  <dc-import name="SectorIcon" style="flex-shrink: 0;" hint-size="36px,36px" theme="{{ theme }}" bg="{{ logoBg }}" size="36"></dc-import>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
    <span style="font-size: 15px; font-weight: 700; color: #191F28; line-height: 1.35; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ name }}</span>
    <sc-if value="{{ hasQuote }}" hint-placeholder-val="{{ true }}"><dc-import name="LiveTicker" hint-size="130px,17px" mode="row-quote" base="{{ chgNum }}" price="{{ price }}" seed="{{ etf }}"></dc-import></sc-if>
    <sc-if value="{{ hasSub }}"><span style="font-size: 12.5px; color: #6B7684; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ sub }}</span></sc-if>
  </div>
  <sc-if value="{{ hasSticker }}" hint-placeholder-val="{{ true }}"><dc-import name="Sticker" style="flex-shrink: 0;" hint-size="88px,28px" mark="{{ sigMark }}" mark-size="{{ sigMarkSz }}" color="{{ sigColor }}" bg="{{ sigBg }}" line="{{ sigBg }}" label="{{ sigLabel }}" label-color="{{ sigTc }}" size="28" radius="9"></dc-import></sc-if>
  <sc-if value="{{ hasChg }}"><span style="flex-shrink: 0; font-family: 'JetBrains Mono', Pretendard, monospace; font-size: 14px; font-weight: 700; color: {{ chColor }};">{{ chg }}</span></sc-if>
  <sc-if value="{{ hasChevron }}"><dc-import name="Chevron" hint-size="16px,16px" size="16" color="#B0B8C1"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:362,&quot;height&quot;:70},&quot;etf&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;AXAI&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;미래에셋 · 국내 반도체 상위 10종&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;AI·반도체&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;logoBg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3D34E0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;chgNum&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;chg&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;+3.2%&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;trail&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;chg&quot;,&quot;options&quot;:[&quot;sticker&quot;,&quot;chg&quot;,&quot;chevron&quot;,&quot;none&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;sigLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sigMark&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sigMarkSz&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;12px&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sigColor&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;#8E8E93&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sigBg&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;#F2F4F6&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sigTc&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;divider&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;TIGER 반도체TOP10&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, trail = p.trail || 'sticker';
    const TC = { '#F04452': '#D22F3D', '#8E8E93': '#636366', '#3182F6': '#1B64DA' };
    return {
      etf: p.etf || '', name: p.title || '', theme: p.theme || '', logoBg: p.logoBg || '#8E8E93',
      hasQuote: p.price !== undefined && p.price !== '' , price: p.price || '', chgNum: p.chgNum || 0,
      hasSub: (p.price === undefined || p.price === '') && !!p.sub, sub: p.sub || '',
      hasSticker: trail === 'sticker' && !!p.sigLabel, sigMark: p.sigMark || '', sigMarkSz: p.sigMarkSz || '12px', sigColor: p.sigColor || '#8E8E93', sigBg: p.sigBg || '#F2F4F6', sigLabel: p.sigLabel || '', sigTc: p.sigTc || TC[p.sigColor] || '#636366',
      hasChg: trail === 'chg', chg: p.chg || '', chColor: String(p.chg || '').startsWith('-') ? '#3182F6' : '#F04452',
      hasChevron: trail === 'chevron',
      line: p.divider === false ? 'none' : '1px solid #F2F4F6',
      onClick: p.onClick || (() => {})
    };
  }
}
</script>
</body>
</html>
