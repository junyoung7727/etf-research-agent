<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display: flex; flex-direction: column; font-family: Pretendard, -apple-system, sans-serif;">
  <div style="width: 38px; height: 4px; border-radius: 999px; background: #E5E8EB; margin: 0 auto 18px;"></div>
  <sc-if value="{{ hasTitle }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: flex-start; gap: 10px;">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 19px; font-weight: 800; color: #191F28; letter-spacing: -0.03em; line-height: 1.3; word-break: keep-all;">{{ title }}</span>
        <sc-if value="{{ hasSub }}"><span style="font-size: 14px; line-height: 1.55; color: #6B7684; word-break: keep-all;">{{ sub }}</span></sc-if>
      </div>
      <sc-if value="{{ hasClose }}"><dc-import name="IconButton" hint-size="32px,32px" icon="close" size="32" color="#8B95A1" on-click="{{ onClose }}"></dc-import></sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 402, &quot;height&quot;: 90}, &quot;title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;시트 제목&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;sub&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;onClose&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { title: p.title || '', hasTitle: !!p.title, sub: p.sub || '', hasSub: !!p.sub, hasClose: !!p.onClose, onClose: p.onClose || (() => {}) };
  }
}
</script>
</body>
</html>
