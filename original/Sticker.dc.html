<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="display: inline-flex; align-items: center; justify-content: center; gap: 4px; box-sizing: border-box; white-space: nowrap; flex-shrink: 0; width: {{ boxW }}; min-width: {{ minW }}; height: {{ box }}; padding: {{ pad }}; border-radius: {{ radius }}; background: linear-gradient(160deg, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.42) 100%), {{ bg }}; border: 1px solid rgba(255,255,255,0.75); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95), inset 0 -1px 1px {{ line }}, 0 8px 20px {{ line }}, 0 1px 2px rgba(0,0,0,0.06); backdrop-filter: blur(20px) saturate(180%); color: {{ labelColor }}; font-family: Pretendard, -apple-system, sans-serif; font-size: 12.5px; font-weight: 800; line-height: 1;"><span style="color: {{ color }}; font-size: {{ markSize }}; white-space: pre-line; line-height: 0.52; text-align: center;">{{ mark }}</span>{{ label }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 120, &quot;height&quot;: 60}, &quot;mark&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;▲&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;markSize&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;13px&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;color&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#F04452&quot;, &quot;options&quot;: [&quot;#F04452&quot;, &quot;#3182F6&quot;, &quot;#8E8E93&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;bg&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;rgba(240,68,82,0.18)&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;line&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;rgba(240,68,82,0.18)&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;label&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;labelColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#D22F3D&quot;, &quot;options&quot;: [&quot;#D22F3D&quot;, &quot;#1B64DA&quot;, &quot;#636366&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;size&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 28, &quot;min&quot;: 16, &quot;max&quot;: 40, &quot;tsType&quot;: &quot;number&quot;}, &quot;radius&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 9, &quot;min&quot;: 4, &quot;max&quot;: 16, &quot;tsType&quot;: &quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const label = p.label || '';
    const box = (p.size ?? 28) + 'px';
    return {
      mark: p.mark ?? '■',
      markSize: p.markSize ?? '13px',
      color: p.color ?? '#8E8E93',
      bg: p.bg ?? 'rgba(142,142,147,0.22)',
      line: p.line ?? 'rgba(142,142,147,0.2)',
      labelColor: p.labelColor ?? '#636366',
      label,
      box,
      boxW: label ? 'auto' : box,
      minW: label ? '44px' : box,
      pad: label ? '0 9px' : '0',
      radius: (p.radius ?? 9) + 'px'
    };
  }
}
</script>
</body>
</html>
