<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ onClick }}" style="position: relative; flex: {{ flex }}; text-align: center; font-size: 14px; font-weight: {{ fw }}; color: {{ c }}; padding: 10px 12px 11px; border-bottom: 2px solid {{ line }}; cursor: pointer; white-space: nowrap; font-family: Pretendard, -apple-system, sans-serif; box-sizing: border-box;">
  {{ label }}
  <sc-if value="{{ hasDot }}"><span style="position: absolute; top: 8px; right: 4px; width: 5px; height: 5px; border-radius: 999px; background: #F04452;"></span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 160, &quot;height&quot;: 50}, &quot;label&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;탭&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;on&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;grow&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;dot&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;onClick&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, on = !!p.on;
    return { label: p.label || '', fw: on ? '800' : '600', c: on ? '#191F28' : '#6B7684', line: on ? '#191F28' : 'transparent', flex: p.grow ? '1' : 'none', hasDot: !!p.dot, onClick: p.onClick || (() => {}) };
  }
}
</script>
</body>
</html>
