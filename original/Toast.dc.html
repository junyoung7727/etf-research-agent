<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes toastRise { 0% { opacity: 0; transform: translateY(24px) scale(0.98); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes toastCheck { 0% { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
@keyframes toastDraw { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
</style>
</helmet>
<div style="position: absolute; left: 16px; right: 16px; bottom: {{ bottom }}; z-index: 60; background: #2B2F3A; color: #FFFFFF; border-radius: 16px; padding: 12px 12px 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.28); display: flex; align-items: center; gap: 12px; font-family: Pretendard, -apple-system, sans-serif; animation: toastRise 0.34s cubic-bezier(0.22, 1, 0.36, 1) both;">
  <span style="width: 24px; height: 24px; border-radius: 999px; background: #22C55E; display: flex; align-items: center; justify-content: center; flex-shrink: 0; animation: toastCheck 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) 0.08s both;">
    <svg width="13" height="13" viewBox="0 0 14 14"><path d="M3 7.2l2.6 2.6L11 4.4" style="stroke: #FFFFFF; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; animation: toastDraw 0.35s ease 0.2s both;"></path></svg>
  </span>
  <span style="flex: 1; min-width: 0; font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; text-align: left; word-break: keep-all;">{{ text }}</span>
  <sc-if value="{{ hasAction }}"><span onClick="{{ onAction }}" style="flex-shrink: 0; font-size: 13.5px; font-weight: 700; color: #FFFFFF; background: #4A4F5C; border-radius: 10px; padding: 8px 13px; cursor: pointer;" style-active="opacity: 0.7;">{{ actionLabel }}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 402, &quot;height&quot;: 120}, &quot;text&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;관심에 담았어요&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;actionLabel&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;bottom&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;32px&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;onAction&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, hasAction = !!p.actionLabel;
    return { text: p.text || '', bottom: p.bottom || '32px', hasAction, actionLabel: p.actionLabel || '', onAction: p.onAction || (() => {}) };
  }
}
</script>
</body>
</html>
