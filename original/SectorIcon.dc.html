<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: {{ px }}; height: {{ px }}; border-radius: 999px; background: {{ bgC }}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
  <svg width="{{ ipx }}" height="{{ ipx }}" viewBox="0 0 24 24" style="display: block;">
    <sc-if value="{{ isChip }}">
      <g>
        <rect x="8.25" y="1.6" width="1.8" height="3.6" rx="0.9" style="fill: #FFFFFF;"></rect>
        <rect x="11.1" y="1.6" width="1.8" height="3.6" rx="0.9" style="fill: #FFFFFF;"></rect>
        <rect x="13.95" y="1.6" width="1.8" height="3.6" rx="0.9" style="fill: #FFFFFF;"></rect>
        <rect x="8.25" y="18.8" width="1.8" height="3.6" rx="0.9" style="fill: #FFFFFF;"></rect>
        <rect x="11.1" y="18.8" width="1.8" height="3.6" rx="0.9" style="fill: #FFFFFF;"></rect>
        <rect x="13.95" y="18.8" width="1.8" height="3.6" rx="0.9" style="fill: #FFFFFF;"></rect>
        <rect x="1.6" y="8.25" width="3.6" height="1.8" rx="0.9" style="fill: #FFFFFF;"></rect>
        <rect x="1.6" y="11.1" width="3.6" height="1.8" rx="0.9" style="fill: #FFFFFF;"></rect>
        <rect x="1.6" y="13.95" width="3.6" height="1.8" rx="0.9" style="fill: #FFFFFF;"></rect>
        <rect x="18.8" y="8.25" width="3.6" height="1.8" rx="0.9" style="fill: #FFFFFF;"></rect>
        <rect x="18.8" y="11.1" width="3.6" height="1.8" rx="0.9" style="fill: #FFFFFF;"></rect>
        <rect x="18.8" y="13.95" width="3.6" height="1.8" rx="0.9" style="fill: #FFFFFF;"></rect>
        <rect x="4.6" y="4.6" width="14.8" height="14.8" rx="3.6" style="fill: #FFFFFF;"></rect>
        <rect x="8.9" y="8.9" width="6.2" height="6.2" rx="1.7" style="fill: {{ bgC }};"></rect>
      </g>
    </sc-if>
    <sc-if value="{{ isYield }}">
      <g>
        <ellipse cx="12" cy="6.4" rx="7.6" ry="3.1" style="fill: #FFFFFF;"></ellipse>
        <path d="M4.4 9.4c0 1.7 3.4 3.1 7.6 3.1s7.6-1.4 7.6-3.1v3.3c0 1.7-3.4 3.1-7.6 3.1s-7.6-1.4-7.6-3.1z" style="fill: #FFFFFF;"></path>
        <path d="M4.4 15.4c0 1.7 3.4 3.1 7.6 3.1s7.6-1.4 7.6-3.1v2.4c0 1.7-3.4 3.1-7.6 3.1s-7.6-1.4-7.6-3.1z" style="fill: #FFFFFF;"></path>
      </g>
    </sc-if>
    <sc-if value="{{ isBond }}">
      <g>
        <rect x="3.6" y="3.4" width="16.8" height="17.2" rx="3.2" style="fill: #FFFFFF;"></rect>
        <rect x="7.2" y="8.2" width="9.6" height="1.9" rx="0.95" style="fill: {{ bgC }};"></rect>
        <rect x="7.2" y="11.7" width="9.6" height="1.9" rx="0.95" style="fill: {{ bgC }};"></rect>
        <rect x="7.2" y="15.2" width="5.4" height="1.9" rx="0.95" style="fill: {{ bgC }};"></rect>
      </g>
    </sc-if>
    <sc-if value="{{ isDefense }}">
      <g>
        <path d="M12 1.9l8.2 3v6.6c0 5-3.3 8.9-8.2 10.6-4.9-1.7-8.2-5.6-8.2-10.6V4.9z" style="fill: #FFFFFF;"></path>
        <path d="M8.3 11.9l2.6 2.6 4.8-5.2" style="fill: none; stroke: {{ bgC }}; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;"></path>
      </g>
    </sc-if>
    <sc-if value="{{ isBio }}">
      <g>
        <path d="M8.4 2.2h7.2a1.3 1.3 0 010 2.6h-.5v4l4.6 8.6c1.1 2-.4 4.4-2.6 4.4H6.9c-2.2 0-3.7-2.4-2.6-4.4l4.6-8.6v-4h-.5a1.3 1.3 0 010-2.6z" style="fill: #FFFFFF;"></path>
        <circle cx="10.2" cy="17.2" r="1.5" style="fill: {{ bgC }};"></circle>
        <circle cx="14.1" cy="14.9" r="1.1" style="fill: {{ bgC }};"></circle>
      </g>
    </sc-if>
    <sc-if value="{{ isGreen }}">
      <g>
        <path d="M20.6 3.4c.4 9.6-4.4 14.4-11.2 14.4H6.2c-1 0-1.7-.9-1.5-1.9C6.2 8.3 11.5 3.4 20.6 3.4z" style="fill: #FFFFFF;"></path>
        <path d="M4.6 20.6c1.2-3.8 3.6-6.8 7.2-8.9" style="fill: none; stroke: #FFFFFF; stroke-width: 2.2; stroke-linecap: round;"></path>
      </g>
    </sc-if>
    <sc-if value="{{ isCommodity }}">
      <g>
        <path d="M12 2.2l8.6 4.5v10.6L12 21.8 3.4 17.3V6.7z" style="fill: #FFFFFF;"></path>
        <path d="M3.4 6.7L12 11.2l8.6-4.5M12 11.2v10.6" style="fill: none; stroke: {{ bgC }}; stroke-width: 1.9; stroke-linejoin: round;"></path>
      </g>
    </sc-if>
    <sc-if value="{{ isEquity }}">
      <g>
        <rect x="3.2" y="12.8" width="4.6" height="8.4" rx="1.8" style="fill: #FFFFFF;"></rect>
        <rect x="9.7" y="7.4" width="4.6" height="13.8" rx="1.8" style="fill: #FFFFFF;"></rect>
        <rect x="16.2" y="2.8" width="4.6" height="18.4" rx="1.8" style="fill: #FFFFFF;"></rect>
      </g>
    </sc-if>
    <sc-if value="{{ isEtc }}">
      <g>
        <circle cx="12" cy="12" r="9.4" style="fill: #FFFFFF;"></circle>
        <path d="M7.6 13.9l3.1-3.4 2.5 2.2 3.4-4" style="fill: none; stroke: {{ bgC }}; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;"></path>
      </g>
    </sc-if>
  </svg>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;theme&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;AI·반도체&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3D34E0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:36,&quot;min&quot;:16,&quot;max&quot;:72,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const size = Number(p.size) || 36;
    const t = String(p.theme || '');
    const kind =
      /반도체|AI|소프트|로봇|테크/.test(t) ? 'chip' :
      /배당|인프라|리츠/.test(t) ? 'yield' :
      /채권|금리/.test(t) ? 'bond' :
      /방산|국방/.test(t) ? 'defense' :
      /바이오|헬스|제약/.test(t) ? 'bio' :
      /친환경|신재생|2차전지|원자력|에너지전환/.test(t) ? 'green' :
      /원자재|금|에너지|원유/.test(t) ? 'commodity' :
      /국내주식|해외주식|지수|주식/.test(t) ? 'equity' : 'etc';
    return {
      px: size + 'px',
      ipx: Math.round(size * 0.56) + 'px',
      bgC: p.bg || '#8E8E93',
      isChip: kind === 'chip',
      isYield: kind === 'yield',
      isBond: kind === 'bond',
      isDefense: kind === 'defense',
      isBio: kind === 'bio',
      isGreen: kind === 'green',
      isCommodity: kind === 'commodity',
      isEquity: kind === 'equity',
      isEtc: kind === 'etc'
    };
  }
}

</script>
</body>
</html>
