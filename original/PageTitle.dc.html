<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 20px 0; font-family: Pretendard, -apple-system, sans-serif;">
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
    <span style="font-size: 24px; font-weight: 800; color: #191F28; letter-spacing: -0.03em; line-height: 1.25; word-break: keep-all;">{{ title }}</span>
    <sc-if value="{{ hasSub }}"><span style="font-size: 13px; color: #6B7684; line-height: 1.4;">{{ sub }}</span></sc-if>
  </div>
  <sc-if value="{{ hasMeta }}"><span style="flex-shrink: 0; margin-top: 4px; font-size: 11.5px; font-weight: 700; color: #6B7684; background: #F2F4F6; border-radius: 8px; padding: 5px 9px; white-space: nowrap;">{{ meta }}</span></sc-if>
  <sc-if value="{{ hasAvatar }}"><span onClick="{{ onAvatar }}" style="flex-shrink: 0; width: 34px; height: 34px; border-radius: 999px; background: {{ avatarBg }}; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(28,28,30,0.1);">{{ avatar }}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:80},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;페이지 제목&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;avatar&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;avatarBg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3D34E0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onAvatar&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() => void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { title: p.title || '', sub: p.sub || '', hasSub: !!p.sub, meta: p.meta || '', hasMeta: !!p.meta, hasAvatar: !!p.avatar, avatar: p.avatar || '', avatarBg: p.avatarBg || '#3D34E0', onAvatar: p.onAvatar || (() => {}) };
  }
}
</script>
</body>
</html>
