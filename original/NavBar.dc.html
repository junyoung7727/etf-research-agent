<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display: flex; align-items: center; height: 44px; padding: 0 8px; flex-shrink: 0; box-sizing: border-box; font-family: Pretendard, -apple-system, sans-serif;">
  <sc-if value="{{ hasBack }}" hint-placeholder-val="{{ true }}"><dc-import name="IconButton" hint-size="38px,38px" icon="{{ backIcon }}" on-click="{{ onBack }}"></dc-import></sc-if>
  <sc-if value="{{ noBack }}"><span style="width: 38px; flex-shrink: 0;"></span></sc-if>
  <span style="flex: 1; min-width: 0; text-align: center; font-size: 16px; font-weight: 800; color: #191F28; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px;">{{ title }}</span>
  <sc-if value="{{ hasRightIcon }}"><dc-import name="IconButton" hint-size="38px,38px" icon="{{ rightIcon }}" color="#4E5968" badge="{{ rightBadge }}" on-click="{{ onRight }}"></dc-import></sc-if>
  <sc-if value="{{ hasRightLabel }}"><span onClick="{{ onRight }}" style="flex-shrink: 0; min-width: 38px; text-align: right; font-size: 13.5px; font-weight: 700; color: {{ rightColor }}; padding: 8px 6px; cursor: pointer; white-space: nowrap;">{{ rightLabel }}</span></sc-if>
  <sc-if value="{{ noRight }}"><span style="width: 38px; flex-shrink: 0;"></span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 402, &quot;height&quot;: 60}, &quot;title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;화면 제목&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;backIcon&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;back&quot;, &quot;options&quot;: [&quot;back&quot;, &quot;close&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;onBack&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;() =&gt; void&quot;}, &quot;rightIcon&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;&quot;, &quot;options&quot;: [&quot;&quot;, &quot;close&quot;, &quot;search&quot;, &quot;bell&quot;, &quot;gear&quot;, &quot;share&quot;, &quot;plus&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;rightBadge&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;rightLabel&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;rightColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#3D34E0&quot;, &quot;options&quot;: [&quot;#3D34E0&quot;, &quot;#F04452&quot;, &quot;#4E5968&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;onRight&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const hasBack = p.onBack !== undefined ? !!p.onBack : true;
    const hasRightIcon = !!p.rightIcon, hasRightLabel = !hasRightIcon && !!p.rightLabel;
    return {
      title: p.title || '', hasBack, noBack: !hasBack, backIcon: p.backIcon || 'back', onBack: p.onBack || (() => {}),
      hasRightIcon, hasRightLabel, noRight: !hasRightIcon && !hasRightLabel,
      rightIcon: p.rightIcon || '', rightBadge: p.rightBadge || '', rightLabel: p.rightLabel || '',
      rightColor: p.rightColor || '#3D34E0', onRight: p.onRight || (() => {})
    };
  }
}
</script>
</body>
</html>
