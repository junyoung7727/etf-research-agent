<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 16 16" style="flex-shrink: 0; transform: {{ rot }}; transition: transform 0.2s;"><path d="M6 3.5L10.5 8 6 12.5" style="stroke: {{ c }}; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round;"></path></svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 60, &quot;height&quot;: 60}, &quot;dir&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;right&quot;, &quot;options&quot;: [&quot;right&quot;, &quot;down&quot;, &quot;up&quot;, &quot;left&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;size&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 16, &quot;tsType&quot;: &quot;number&quot;}, &quot;color&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#B0B8C1&quot;, &quot;options&quot;: [&quot;#B0B8C1&quot;, &quot;#8B95A1&quot;, &quot;#4E5968&quot;, &quot;#191F28&quot;], &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, d = p.dir || 'right';
    return { size: Number(p.size || 16), c: p.color || '#B0B8C1', rot: d === 'down' ? 'rotate(90deg)' : d === 'up' ? 'rotate(-90deg)' : d === 'left' ? 'rotate(180deg)' : 'none' };
  }
}
</script>
</body>
</html>
