<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; background: #F7F8FA; border-radius: 8px; padding: 6px 10px; flex-shrink: 0;"><span style="color: #5E6672;">{{ name }}</span><span style="width: 5px; height: 5px; border-radius: 999px; background: {{ color }};"></span><span style="font-weight: 800; color: {{ labelColor }};">{{ dir }}</span></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 140, &quot;height&quot;: 50}, &quot;name&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;매크로&quot;, &quot;options&quot;: [&quot;이슈&quot;, &quot;차트&quot;, &quot;매크로&quot;, &quot;밸류&quot;, &quot;수급&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;dir&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;부담&quot;, &quot;options&quot;: [&quot;도움&quot;, &quot;중립&quot;, &quot;부담&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;color&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#3182F6&quot;, &quot;options&quot;: [&quot;#F04452&quot;, &quot;#8E8E93&quot;, &quot;#3182F6&quot;], &quot;tsType&quot;: &quot;string&quot;}, &quot;labelColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#1B64DA&quot;, &quot;options&quot;: [&quot;#D22F3D&quot;, &quot;#636366&quot;, &quot;#1B64DA&quot;], &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      name: p.axisName ?? p.name ?? '매크로',
      dir: p.dir ?? '중립',
      color: p.color ?? '#8E8E93',
      labelColor: p.labelColor ?? '#636366'
    };
  }
}
</script>
</body>
</html>
