services:
  edge:
    build: .
    ports:
      - "127.0.0.1:8025:8018"
    environment:
      EDGE_MODE: demo
      EDGE_PUBLIC_ORIGIN: http://127.0.0.1:8025
    volumes:
      - edge-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  edge-data:
